name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run tests
        run: make test

  pkg:
    name: PS3 package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set env vars
        run: |
          echo "sha_name=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_ENV
          sudo apt-get update
          sudo apt-get install -y python2.7

      # Prebuilt PSL1GHT + ps3libraries, the same toolchain Apollo Save Tool builds with.
      - name: Download PSL1GHT toolchain
        run: |
          curl -sL https://github.com/bucanero/ps3toolchain/releases/download/ubuntu-latest-fad3b5fb/ps3dev-ubuntu-latest-2020-08-31.tar.gz | tar xz -C ./
          curl -sL https://github.com/ps3dev/PSL1GHT/raw/master/ppu/include/sysutil/sysutil.h -o ps3dev/ppu/include/sysutil/sysutil.h
          echo "PS3DEV=${GITHUB_WORKSPACE}/ps3dev" >> $GITHUB_ENV
          echo "PSL1GHT=${GITHUB_WORKSPACE}/ps3dev" >> $GITHUB_ENV

      - name: Install Tiny3D and libfont
        run: |
          git clone --depth 1 https://github.com/wargio/tiny3D.git tiny3d-src
          make -C tiny3d-src/lib install
          make -C tiny3d-src/libfont install

      # HTTPS for cover downloads: mbedTLS + libcurl, built the way Apollo Save Tool's CI does.
      - name: Install mbedTLS
        run: |
          curl -sL https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-2.28.10/mbedtls-2.28.10.tar.bz2 | tar xj -C ./
          curl -sL https://github.com/bucanero/ps3libraries/raw/74095b14f6327420787ca2f7fe95b0c58c835cc4/patches/mbedtls-2.28.10.patch -o mbedtls-2.28.10.patch
          cd mbedtls-2.28.10
          patch -p1 < ../mbedtls-2.28.10.patch
          cd library
          chmod +x ps3-build.sh
          ./ps3-build.sh
          cp lib*.a $PS3DEV/portlibs/ppu/lib/
          cp -R ../include/mbedtls $PS3DEV/portlibs/ppu/include/

      - name: Install cURL
        run: |
          curl -sL https://gist.github.com/bucanero/c0b3e143657df54f28e2027abca13c71/raw/e0f879ba4ac6a29f03f024b58084a5fa95ed1a57/curl-ps3-build.sh -o curl-ps3-build.sh
          chmod +x curl-ps3-build.sh
          ./curl-ps3-build.sh

      - name: Build package
        run: make pkg

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ps3sx2-${{ env.sha_name }}
          path: ps3sx2.pkg
          if-no-files-found: error
